<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LiftLog" />
  <meta name="description" content="Track your weightlifting workouts" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>LiftLog</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c26;
      --surface3: #252533;
      --border: #2e2e3e;
      --accent: #e8ff47;
      --accent2: #47c8ff;
      --accent3: #ff6b47;
      --text: #f0f0f8;
      --text2: #8888a8;
      --text3: #5a5a78;
      --radius: 16px;
      --radius-sm: 10px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ── SCREENS ── */
    .screen {
      display: none;
      flex-direction: column;
      min-height: 100dvh;
      padding-top: calc(var(--safe-top) + 0px);
      padding-bottom: calc(var(--safe-bot) + 80px);
    }
    .screen.active { display: flex; }

    /* ── NAV BAR ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10,10,15,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: calc(var(--safe-top) + 14px) 20px 14px;
    }
    .topbar-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 1px;
      color: var(--text);
      flex: 1;
    }
    .topbar-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--accent);
      letter-spacing: 2px;
    }
    .btn-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .btn-icon:active { transform: scale(0.92); background: var(--surface3); }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(10,10,15,0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      padding-bottom: var(--safe-bot);
    }
    .nav-btn {
      flex: 1;
      display: flex; flex-direction: column; align-items: center;
      gap: 4px;
      padding: 10px 0;
      color: var(--text3);
      cursor: pointer;
      transition: color 0.15s;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .nav-btn .nav-icon { font-size: 22px; }
    .nav-btn.active { color: var(--accent); }
    .nav-btn:active { opacity: 0.7; }

    /* ── HOME ── */
    .hero {
      padding: 32px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hero-greeting {
      font-size: 13px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 52px;
      line-height: 1;
      color: var(--text);
    }
    .hero-title span { color: var(--accent); }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      padding: 0 20px 24px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 12px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .stat-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--accent);
      line-height: 1;
    }
    .stat-label {
      font-size: 10px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-primary {
      background: var(--accent);
      color: #0a0a0f;
      border: none;
      border-radius: var(--radius);
      padding: 18px 24px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: all 0.15s;
      width: 100%;
    }
    .btn-primary:active { transform: scale(0.97); opacity: 0.9; }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 24px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: all 0.15s;
      width: 100%;
    }
    .btn-secondary:active { transform: scale(0.97); background: var(--surface2); }

    .action-btns {
      padding: 0 20px;
      display: flex; flex-direction: column; gap: 12px;
    }

    .recent-section {
      padding: 28px 20px 0;
    }
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      color: var(--text2);
    }

    .workout-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex; flex-direction: column; gap: 8px;
    }
    .workout-card:active { transform: scale(0.985); background: var(--surface2); }
    .workout-card-header {
      display: flex; align-items: center; justify-content: space-between;
    }
    .workout-date {
      font-size: 12px; color: var(--text2);
      text-transform: uppercase; letter-spacing: 1px;
    }
    .workout-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px; color: var(--text);
      letter-spacing: 0.5px;
    }
    .workout-meta {
      font-size: 12px; color: var(--text2);
      display: flex; gap: 12px;
    }
    .tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      color: var(--text2);
    }
    .tag.accent { background: rgba(232,255,71,0.12); border-color: rgba(232,255,71,0.3); color: var(--accent); }

    /* ── WORKOUT SCREEN ── */
    .workout-builder {
      padding: 0 20px;
    }

    .date-display {
      padding: 16px 20px;
      font-size: 13px;
      color: var(--text2);
      display: flex; align-items: center; gap: 8px;
    }
    .date-display span { color: var(--accent); font-weight: 600; }

    .exercise-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      overflow: hidden;
    }
    .exercise-header {
      padding: 14px 16px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .exercise-name-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 600;
    }
    .exercise-name-input::placeholder { color: var(--text3); }

    .hint-box {
      background: rgba(71, 200, 255, 0.08);
      border: 1px solid rgba(71, 200, 255, 0.2);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      margin: 10px 14px;
      font-size: 12px;
      color: var(--accent2);
      display: flex; align-items: flex-start; gap: 8px;
    }
    .hint-box.hidden { display: none; }

    .sets-container { padding: 10px 14px; }

    .sets-header {
      display: grid;
      grid-template-columns: 38px 1fr 1fr 44px;
      gap: 8px;
      padding: 0 0 8px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text3);
      align-items: center;
      text-align: center;
    }

    .set-row {
      display: grid;
      grid-template-columns: 38px 1fr 1fr 44px;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }
    .set-num {
      width: 38px; height: 68px;
      background: var(--surface2);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
      color: var(--text2);
      flex-shrink: 0;
    }
    .set-num.completed { background: rgba(232,255,71,0.15); color: var(--accent); }

    .counter-group {
      display: flex;
      flex-direction: column;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .counter-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text3);
      text-align: center;
      padding: 5px 0 3px;
      border-bottom: 1px solid var(--border);
    }
    .counter-controls {
      display: flex;
      align-items: center;
      height: 48px;
    }
    .counter-btn {
      width: 44px; height: 48px;
      background: transparent;
      border: none;
      color: var(--text2);
      font-size: 24px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.1s;
      user-select: none;
      -webkit-user-select: none;
    }
    .counter-btn:active { background: var(--surface3); color: var(--accent); }
    .counter-val {
      flex: 1;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      background: transparent;
      border: none;
      outline: none;
      font-family: 'DM Sans', sans-serif;
      min-width: 0;
      padding: 0;
    }

    .btn-del-set {
      width: 44px; height: 68px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text3);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .btn-del-set:active { background: rgba(255,107,71,0.15); color: var(--accent3); border-color: var(--accent3); }

    .exercise-footer {
      padding: 10px 14px 14px;
      display: flex; gap: 8px;
    }
    .btn-add-set {
      flex: 1;
      background: var(--surface2);
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      color: var(--text2);
      font-size: 13px;
      font-weight: 500;
      padding: 10px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-add-set:active { background: var(--surface3); color: var(--text); }
    .btn-del-exercise {
      width: 40px; height: 40px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text3);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .btn-del-exercise:active { background: rgba(255,107,71,0.15); color: var(--accent3); border-color: var(--accent3); }

    .add-exercise-btn {
      margin: 4px 20px 16px;
      background: transparent;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 16px;
      color: var(--text3);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.15s;
      width: calc(100% - 40px);
    }
    .add-exercise-btn:active { border-color: var(--accent); color: var(--accent); background: rgba(232,255,71,0.05); }

    .save-btn-wrap {
      padding: 4px 20px 16px;
    }

    /* ── AUTOCOMPLETE ── */
    .autocomplete-wrap { position: relative; flex: 1; }
    .autocomplete-list {
      position: absolute;
      top: calc(100% + 8px);
      left: -16px; right: -16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      z-index: 200;
      overflow: hidden;
      display: none;
    }
    .autocomplete-list.visible { display: block; }
    .ac-item {
      padding: 12px 16px;
      font-size: 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      transition: background 0.1s;
    }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:active { background: var(--surface3); }

    /* ── HISTORY ── */
    .history-list { padding: 0 20px; }

    .history-detail {
      padding: 0 20px;
    }
    .history-ex-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      overflow: hidden;
    }
    .history-ex-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 0.5px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    .history-sets {
      padding: 10px 16px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .history-set-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--text2);
    }
    .history-set-badge {
      background: var(--surface2);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      flex-shrink: 0;
    }
    .history-set-data { color: var(--text); font-weight: 500; }

    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px 20px;
      gap: 12px;
    }
    .empty-icon { font-size: 48px; }
    .empty-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: var(--text2);
      letter-spacing: 1px;
    }
    .empty-sub { font-size: 14px; color: var(--text3); text-align: center; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: calc(var(--safe-bot) + 90px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--accent);
      color: #0a0a0f;
      border-radius: 100px;
      padding: 10px 20px;
      font-weight: 600;
      font-size: 14px;
      z-index: 999;
      opacity: 0;
      transition: all 0.3s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 500;
      align-items: flex-end;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      padding: 24px 20px calc(var(--safe-bot) + 24px);
      display: flex; flex-direction: column; gap: 12px;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px; letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .modal-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      outline: none;
      width: 100%;
    }
    .modal-input:focus { border-color: var(--accent); }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Misc ── */
    .divider { height: 1px; background: var(--border); margin: 4px 0; }
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(232,255,71,0.1);
      border: 1px solid rgba(232,255,71,0.25);
      border-radius: 100px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .workout-timer {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      color: var(--accent);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<!-- ═══════════════ HOME SCREEN ═══════════════ -->
<div id="screen-home" class="screen active">
  <div class="topbar">
    <div class="topbar-logo">LiftLog</div>
    <div id="timer-display" class="workout-timer" style="display:none">00:00</div>
  </div>

  <div class="hero">
    <div class="hero-greeting">Ready to crush it?</div>
    <div class="hero-title">Let's <span>Lift.</span></div>
  </div>

  <div class="stats-row" id="stats-row">
    <div class="stat-card">
      <div class="stat-val" id="stat-total">0</div>
      <div class="stat-label">Workouts</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-week">0</div>
      <div class="stat-label">This Week</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-streak">0</div>
      <div class="stat-label">Streak 🔥</div>
    </div>
  </div>

  <div class="action-btns">
    <button class="btn-primary" onclick="startNewWorkout()">
      <span>⚡</span> Start New Workout
    </button>
    <button class="btn-secondary" onclick="showScreen('history')">
      <span>📋</span> View History
    </button>
  </div>

  <div class="recent-section">
    <div class="section-header">
      <div class="section-title">Recent</div>
    </div>
    <div id="recent-list"></div>
  </div>
</div>

<!-- ═══════════════ WORKOUT SCREEN ═══════════════ -->
<div id="screen-workout" class="screen">
  <div class="topbar">
    <button class="btn-icon" onclick="confirmLeave()">←</button>
    <div class="topbar-title" id="workout-title-display">New Workout</div>
    <button class="btn-icon" onclick="openRenameModal()">✏️</button>
  </div>

  <div class="date-display" id="workout-date-display">
    📅 <span id="workout-date-text">Today</span>
    &nbsp;&nbsp;⏱ <span id="workout-elapsed">00:00</span>
  </div>

  <div class="workout-builder" id="exercise-list"></div>

  <button class="add-exercise-btn" onclick="addExercise()">
    <span style="font-size:20px">＋</span> Add Exercise
  </button>

  <div class="save-btn-wrap">
    <button class="btn-primary" onclick="saveWorkout()">
      <span>💾</span> Save Workout
    </button>
  </div>
</div>

<!-- ═══════════════ HISTORY SCREEN ═══════════════ -->
<div id="screen-history" class="screen">
  <div class="topbar">
    <div class="topbar-logo" style="font-size:22px">History</div>
  </div>
  <div class="history-list" id="history-list"></div>
</div>

<!-- ═══════════════ DETAIL SCREEN ═══════════════ -->
<div id="screen-detail" class="screen">
  <div class="topbar">
    <button class="btn-icon" onclick="showScreen('history')">←</button>
    <div class="topbar-title" id="detail-title"></div>
    <button class="btn-icon" id="detail-delete-btn" onclick="deleteWorkout()">🗑</button>
  </div>
  <div class="date-display"><span id="detail-meta"></span></div>
  <div class="history-detail" id="detail-content"></div>
</div>

<!-- ═══════════════ BOTTOM NAV ═══════════════ -->
<div class="bottom-nav">
  <div class="nav-btn active" id="nav-home" onclick="showScreen('home')">
    <div class="nav-icon">🏠</div>
    <div>Home</div>
  </div>
  <div class="nav-btn" id="nav-workout" onclick="showScreen('workout')" style="display:none">
    <div class="nav-icon">⚡</div>
    <div>Workout</div>
  </div>
  <div class="nav-btn" id="nav-history" onclick="showScreen('history')">
    <div class="nav-icon">📋</div>
    <div>History</div>
  </div>
</div>

<!-- ═══════════════ MODALS ═══════════════ -->
<div id="rename-modal" class="modal-overlay" onclick="if(event.target===this)this.classList.remove('active')">
  <div class="modal">
    <div class="modal-title">Rename Workout</div>
    <input class="modal-input" id="rename-input" placeholder="e.g. Push Day, Leg Day…" maxlength="40" />
    <button class="btn-primary" onclick="applyRename()">Save Name</button>
    <button class="btn-secondary" onclick="document.getElementById('rename-modal').classList.remove('active')">Cancel</button>
  </div>
</div>

<div id="leave-modal" class="modal-overlay" onclick="if(event.target===this)this.classList.remove('active')">
  <div class="modal">
    <div class="modal-title">Leave Workout?</div>
    <p style="font-size:14px;color:var(--text2);">Your unsaved workout will be lost.</p>
    <button class="btn-primary" onclick="leaveWorkout()">Leave Without Saving</button>
    <button class="btn-secondary" onclick="saveWorkout()">Save & Leave</button>
    <button class="btn-secondary" onclick="document.getElementById('leave-modal').classList.remove('active')">Keep Going</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════
//  STATE & STORAGE
// ════════════════════════════════════════════
let workouts = JSON.parse(localStorage.getItem('liftlog_workouts') || '[]');
let currentWorkout = null;
let exerciseCounter = 0;
let workoutStartTime = null;
let timerInterval = null;
let activeScreen = 'home';
let viewingWorkoutId = null;

const DEFAULT_EXERCISES = [
  'Bench Press','Squat','Deadlift','Overhead Press','Barbell Row',
  'Pull-Up','Push-Up','Dumbbell Curl','Tricep Pushdown','Lat Pulldown',
  'Leg Press','Leg Curl','Leg Extension','Calf Raise','Face Pull',
  'Incline Bench Press','Cable Fly','Dumbbell Row','Romanian Deadlift',
  'Hip Thrust','Lunges','Bulgarian Split Squat','Plank','Dumbbell Fly',
  'Hammer Curl','Skull Crusher','Close Grip Bench','Arnold Press','Lateral Raise',
  'Front Raise','Seated Row','T-Bar Row','Chest Dip','Tricep Dip'
];

function save() {
  localStorage.setItem('liftlog_workouts', JSON.stringify(workouts));
}

// ════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const nb = document.getElementById('nav-' + name);
  if (nb) nb.classList.add('active');
  activeScreen = name;
  if (name === 'home') renderHome();
  if (name === 'history') renderHistory();
}

// ════════════════════════════════════════════
//  TIMER
// ════════════════════════════════════════════
function startTimer() {
  workoutStartTime = Date.now();
  timerInterval = setInterval(updateTimer, 1000);
}
function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}
function updateTimer() {
  if (!workoutStartTime) return;
  const elapsed = Math.floor((Date.now() - workoutStartTime) / 1000);
  const m = String(Math.floor(elapsed / 60)).padStart(2,'0');
  const s = String(elapsed % 60).padStart(2,'0');
  const el = document.getElementById('workout-elapsed');
  if (el) el.textContent = m + ':' + s;
}

// ════════════════════════════════════════════
//  HOME
// ════════════════════════════════════════════
function renderHome() {
  // Stats
  const total = workouts.length;
  const now = new Date();
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay());
  weekStart.setHours(0,0,0,0);
  const thisWeek = workouts.filter(w => new Date(w.date) >= weekStart).length;

  // Streak
  let streak = 0;
  const sorted = [...workouts].sort((a,b) => new Date(b.date)-new Date(a.date));
  const uniqueDays = [...new Set(sorted.map(w => w.date.split('T')[0]))];
  const today = toDateStr(new Date());
  let checkDate = today;
  for (let d of uniqueDays) {
    if (d === checkDate) {
      streak++;
      const prev = new Date(checkDate);
      prev.setDate(prev.getDate() - 1);
      checkDate = toDateStr(prev);
    } else { break; }
  }

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-week').textContent = thisWeek;
  document.getElementById('stat-streak').textContent = streak;

  // Recent
  const container = document.getElementById('recent-list');
  const recent = [...workouts].sort((a,b) => new Date(b.date)-new Date(a.date)).slice(0,5);
  if (recent.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">🏋️</div><div class="empty-title">No workouts yet</div><div class="empty-sub">Start your first workout to begin tracking progress.</div></div>`;
    return;
  }
  container.innerHTML = recent.map(w => workoutCardHTML(w)).join('');
}

function workoutCardHTML(w) {
  const d = new Date(w.date);
  const dateStr = d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
  const exNames = w.exercises.map(e => e.name).filter(Boolean).slice(0,3).join(' · ');
  const totalSets = w.exercises.reduce((s,e) => s + (e.sets||[]).length, 0);
  return `<div class="workout-card" onclick="viewWorkout('${w.id}')">
    <div class="workout-card-header">
      <div class="workout-date">${dateStr}</div>
      ${w.duration ? `<div class="tag">⏱ ${w.duration}</div>` : ''}
    </div>
    <div class="workout-name">${w.name || 'Workout'}</div>
    <div class="workout-meta">
      <span>${w.exercises.length} exercise${w.exercises.length!==1?'s':''}</span>
      <span>${totalSets} set${totalSets!==1?'s':''}</span>
    </div>
    ${exNames ? `<div style="font-size:12px;color:var(--text3)">${exNames}</div>` : ''}
  </div>`;
}

// ════════════════════════════════════════════
//  NEW WORKOUT
// ════════════════════════════════════════════
function startNewWorkout() {
  exerciseCounter = 0;
  currentWorkout = {
    id: Date.now().toString(),
    name: 'Workout',
    date: new Date().toISOString(),
    exercises: []
  };
  document.getElementById('workout-title-display').textContent = currentWorkout.name;
  document.getElementById('workout-date-text').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  document.getElementById('exercise-list').innerHTML = '';
  document.getElementById('nav-workout').style.display = '';
  startTimer();
  addExercise();
  showScreen('workout');
}

// ════════════════════════════════════════════
//  EXERCISE MANAGEMENT
// ════════════════════════════════════════════
function addExercise(prefillName='') {
  const id = ++exerciseCounter;
  const div = document.createElement('div');
  div.className = 'exercise-card';
  div.id = 'ex-' + id;
  div.innerHTML = buildExerciseHTML(id, prefillName);
  document.getElementById('exercise-list').appendChild(div);
  const input = div.querySelector('.exercise-name-input');
  if (!prefillName) input.focus();
  setupAutocomplete(input, id);
  // Auto-add one set
  addSet(id);
}

function buildExerciseHTML(id, name='') {
  return `
    <div class="exercise-header">
      <div class="autocomplete-wrap">
        <input class="exercise-name-input" id="exname-${id}" placeholder="Exercise name…" value="${escHtml(name)}"
          oninput="onExerciseNameInput(${id})" onblur="hideAC(${id})" />
        <div class="autocomplete-list" id="ac-${id}"></div>
      </div>
      <button class="btn-del-exercise" onclick="removeExercise(${id})">✕</button>
    </div>
    <div class="hint-box hidden" id="hint-${id}">💡 <span id="hint-text-${id}"></span></div>
    <div class="sets-container" id="sets-${id}">
      <div class="sets-header">
        <div>#</div><div>Reps</div><div>Weight</div><div></div>
      </div>
    </div>
    <div class="exercise-footer">
      <button class="btn-add-set" onclick="addSet(${id})"><span>＋</span> Add Set</button>
    </div>
  `;
}

function removeExercise(id) {
  const el = document.getElementById('ex-' + id);
  if (el) el.remove();
}

function getExerciseData(id) {
  const name = document.getElementById('exname-' + id)?.value.trim() || '';
  const setRows = document.querySelectorAll(`#sets-${id} .set-row`);
  const sets = [];
  setRows.forEach(row => {
    const reps = parseInt(row.querySelector('.reps-val')?.value) || 0;
    const weight = parseFloat(row.querySelector('.weight-val')?.value) || 0;
    sets.push({ reps, weight });
  });
  return { name, sets };
}

// ════════════════════════════════════════════
//  SET MANAGEMENT
// ════════════════════════════════════════════
let setCounter = 0;
function addSet(exId, prefillReps=0, prefillWeight=0) {
  const container = document.getElementById('sets-' + exId);
  if (!container) return;
  const existingSets = container.querySelectorAll('.set-row').length;
  const setNum = existingSets + 1;
  const sid = ++setCounter;
  const row = document.createElement('div');
  row.className = 'set-row';
  row.id = 'set-' + sid;
  row.innerHTML = `
    <div class="set-num" id="setnum-${sid}">${setNum}</div>
    <div class="counter-group">
      <div class="counter-label">Reps</div>
      <div class="counter-controls">
        <button class="counter-btn" ontouchstart="startRepeat(${sid},'reps',-1)" ontouchend="stopRepeat()" onmousedown="startRepeat(${sid},'reps',-1)" onmouseup="stopRepeat()" onmouseleave="stopRepeat()">−</button>
        <input class="counter-val reps-val" id="reps-${sid}" type="number" inputmode="numeric" value="${prefillReps||0}" min="0" max="999" />
        <button class="counter-btn" ontouchstart="startRepeat(${sid},'reps',1)" ontouchend="stopRepeat()" onmousedown="startRepeat(${sid},'reps',1)" onmouseup="stopRepeat()" onmouseleave="stopRepeat()">＋</button>
      </div>
    </div>
    <div class="counter-group">
      <div class="counter-label">Weight (lbs)</div>
      <div class="counter-controls">
        <button class="counter-btn" ontouchstart="startRepeat(${sid},'weight',-2.5)" ontouchend="stopRepeat()" onmousedown="startRepeat(${sid},'weight',-2.5)" onmouseup="stopRepeat()" onmouseleave="stopRepeat()">−</button>
        <input class="counter-val weight-val" id="weight-${sid}" type="number" inputmode="decimal" value="${prefillWeight||0}" min="0" max="9999" step="2.5" />
        <button class="counter-btn" ontouchstart="startRepeat(${sid},'weight',2.5)" ontouchend="stopRepeat()" onmousedown="startRepeat(${sid},'weight',2.5)" onmouseup="stopRepeat()" onmouseleave="stopRepeat()">＋</button>
      </div>
    </div>
    <button class="btn-del-set" onclick="removeSet(${sid}, ${exId})">✕</button>
  `;
  container.appendChild(row);
}

function removeSet(sid, exId) {
  const el = document.getElementById('set-' + sid);
  if (el) el.remove();
  renumberSets(exId);
}

function renumberSets(exId) {
  const container = document.getElementById('sets-' + exId);
  if (!container) return;
  container.querySelectorAll('.set-row').forEach((row, i) => {
    const numEl = row.querySelector('.set-num');
    if (numEl) numEl.textContent = i + 1;
  });
}

// Hold-to-repeat
let repeatInterval = null;
function startRepeat(sid, field, delta) {
  change(sid, field, delta);
  repeatInterval = setInterval(() => change(sid, field, delta), 120);
}
function stopRepeat() { clearInterval(repeatInterval); }
function change(sid, field, delta) {
  const input = document.getElementById(field === 'reps' ? 'reps-' + sid : 'weight-' + sid);
  if (!input) return;
  let val = parseFloat(input.value) || 0;
  val = Math.max(0, val + delta);
  if (field === 'weight') val = Math.round(val * 4) / 4;
  else val = Math.floor(val);
  input.value = val;
}

// ════════════════════════════════════════════
//  AUTOCOMPLETE + LAST-WORKOUT HINT
// ════════════════════════════════════════════
function allExerciseNames() {
  const names = new Set(DEFAULT_EXERCISES);
  workouts.forEach(w => w.exercises.forEach(e => { if(e.name) names.add(e.name); }));
  return [...names].sort();
}

function setupAutocomplete(input, exId) {
  // handled via oninput
}

function onExerciseNameInput(exId) {
  const input = document.getElementById('exname-' + exId);
  const val = input.value.trim().toLowerCase();
  const ac = document.getElementById('ac-' + exId);

  if (val.length < 1) { ac.classList.remove('visible'); ac.innerHTML = ''; return; }

  const matches = allExerciseNames().filter(n => n.toLowerCase().includes(val)).slice(0,6);
  if (matches.length === 0) { ac.classList.remove('visible'); return; }

  ac.innerHTML = matches.map(m =>
    `<div class="ac-item" onmousedown="selectAC(event,${exId},'${escHtml(m)}')" ontouchend="selectAC(event,${exId},'${escHtml(m)}')">${m}</div>`
  ).join('');
  ac.classList.add('visible');

  showHint(exId, input.value.trim());
}

function selectAC(e, exId, name) {
  e.preventDefault();
  const input = document.getElementById('exname-' + exId);
  input.value = name;
  hideAC(exId);
  showHint(exId, name);
  prefillLastWorkout(exId, name);
}

function hideAC(exId) {
  setTimeout(() => {
    const ac = document.getElementById('ac-' + exId);
    if (ac) { ac.classList.remove('visible'); ac.innerHTML = ''; }
    showHint(exId, document.getElementById('exname-' + exId)?.value.trim() || '');
  }, 150);
}

function getLastPerformance(exName) {
  if (!exName) return null;
  const sorted = [...workouts].sort((a,b) => new Date(b.date)-new Date(a.date));
  for (const w of sorted) {
    const ex = w.exercises.find(e => e.name?.toLowerCase() === exName.toLowerCase());
    if (ex && ex.sets && ex.sets.length > 0) return { workout: w, exercise: ex };
  }
  return null;
}

function showHint(exId, exName) {
  const hintBox = document.getElementById('hint-' + exId);
  const hintText = document.getElementById('hint-text-' + exId);
  if (!hintBox || !hintText) return;
  const last = getLastPerformance(exName);
  if (!last) { hintBox.classList.add('hidden'); return; }
  const sets = last.exercise.sets;
  if (!sets || sets.length === 0) { hintBox.classList.add('hidden'); return; }
  const lastSet = sets[sets.length - 1];
  const suggestedReps = lastSet.reps + 1;
  const suggestedWeight = Math.round((lastSet.weight + 2.5) * 4) / 4;
  const d = new Date(last.workout.date);
  const dateStr = d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  hintText.textContent = `${dateStr}: ${sets.length} sets, last set ${lastSet.reps} reps @ ${lastSet.weight} lbs → Try ${suggestedReps} reps or ${suggestedWeight} lbs`;
  hintBox.classList.remove('hidden');
}

function prefillLastWorkout(exId, exName) {
  const last = getLastPerformance(exName);
  if (!last) return;
  // Remove existing sets (except header)
  const container = document.getElementById('sets-' + exId);
  if (!container) return;
  container.querySelectorAll('.set-row').forEach(r => r.remove());
  last.exercise.sets.forEach(s => addSet(exId, s.reps, s.weight));
}

// ════════════════════════════════════════════
//  SAVE WORKOUT
// ════════════════════════════════════════════
function saveWorkout() {
  if (!currentWorkout) return;
  const exCards = document.querySelectorAll('#exercise-list .exercise-card');
  currentWorkout.exercises = [];
  exCards.forEach(card => {
    const id = parseInt(card.id.replace('ex-', ''));
    const data = getExerciseData(id);
    if (data.name || data.sets.length > 0) currentWorkout.exercises.push(data);
  });

  if (currentWorkout.exercises.length === 0) {
    showToast('Add at least one exercise!'); return;
  }

  const elapsed = workoutStartTime ? Math.floor((Date.now() - workoutStartTime) / 1000) : 0;
  const m = Math.floor(elapsed / 60), s = elapsed % 60;
  currentWorkout.duration = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

  // Replace or add
  const idx = workouts.findIndex(w => w.id === currentWorkout.id);
  if (idx >= 0) workouts[idx] = currentWorkout;
  else workouts.unshift(currentWorkout);
  save();

  stopTimer();
  document.getElementById('nav-workout').style.display = 'none';
  document.getElementById('leave-modal').classList.remove('active');
  showToast('Workout saved! 💪');
  currentWorkout = null;
  showScreen('home');
}

// ════════════════════════════════════════════
//  RENAME
// ════════════════════════════════════════════
function openRenameModal() {
  document.getElementById('rename-input').value = currentWorkout?.name || '';
  document.getElementById('rename-modal').classList.add('active');
  setTimeout(() => document.getElementById('rename-input').focus(), 100);
}
function applyRename() {
  const val = document.getElementById('rename-input').value.trim();
  if (!val) return;
  if (currentWorkout) {
    currentWorkout.name = val;
    document.getElementById('workout-title-display').textContent = val;
  }
  document.getElementById('rename-modal').classList.remove('active');
}

// ════════════════════════════════════════════
//  LEAVE
// ════════════════════════════════════════════
function confirmLeave() {
  document.getElementById('leave-modal').classList.add('active');
}
function leaveWorkout() {
  stopTimer();
  currentWorkout = null;
  document.getElementById('nav-workout').style.display = 'none';
  document.getElementById('leave-modal').classList.remove('active');
  showScreen('home');
}

// ════════════════════════════════════════════
//  HISTORY
// ════════════════════════════════════════════
function renderHistory() {
  const container = document.getElementById('history-list');
  if (workouts.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">No History Yet</div><div class="empty-sub">Complete workouts to see them here.</div></div>`;
    return;
  }
  const sorted = [...workouts].sort((a,b) => new Date(b.date)-new Date(a.date));
  container.innerHTML = sorted.map(w => workoutCardHTML(w)).join('');
}

function viewWorkout(id) {
  const w = workouts.find(x => x.id === id);
  if (!w) return;
  viewingWorkoutId = id;
  const d = new Date(w.date);
  document.getElementById('detail-title').textContent = w.name || 'Workout';
  document.getElementById('detail-meta').innerHTML = `📅 <span style="color:var(--text)">${d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</span>${w.duration ? ` &nbsp;⏱ <span style="color:var(--accent)">${w.duration}</span>` : ''}`;

  const content = document.getElementById('detail-content');
  if (!w.exercises || w.exercises.length === 0) {
    content.innerHTML = '<div class="empty-state"><div class="empty-title">No exercises logged.</div></div>';
  } else {
    content.innerHTML = w.exercises.map(ex => {
      const setsHTML = (ex.sets || []).map((s, i) =>
        `<div class="history-set-row"><div class="history-set-badge">Set ${i+1}</div><div class="history-set-data">${s.reps} reps @ ${s.weight} lbs</div></div>`
      ).join('');
      return `<div class="history-ex-card"><div class="history-ex-name">${escHtml(ex.name||'Exercise')}</div><div class="history-sets">${setsHTML}</div></div>`;
    }).join('');
  }
  showScreen('detail');
}

function deleteWorkout() {
  if (!viewingWorkoutId) return;
  workouts = workouts.filter(w => w.id !== viewingWorkoutId);
  save();
  showToast('Workout deleted');
  showScreen('history');
}

// ════════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════════
function toDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════
renderHome();

// Register Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
